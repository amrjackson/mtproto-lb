global
    daemon
    maxconn 256
    log stdout format raw local0 info

defaults
    mode tcp
    timeout connect 5000ms
    timeout client 120000ms   # Increased from 5s to 2 minutes
    timeout server 120000ms   # Increased from 5s to 2 minutes
    timeout check 5000ms
    log global

frontend mtproto_frontend
    bind *:443
    default_backend mtproto_backend

backend mtproto_backend
    balance roundrobin
    option tcp-check
    # Added retry-on and redispatch for resilience
    retry-on conn-failure empty-response response-timeout
    option redispatch
    server proxy1 zephyr.proxy.rlwy.net:50268 check inter 2000ms rise 2 fall 3
    server proxy2 zephyr.proxy.rlwy.net:53272 check inter 2000ms rise 2 fall 3
    server proxy3 crossover.proxy.rlwy.net:12089 check inter 2000ms rise 2 fall 3
