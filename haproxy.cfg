global
    daemon
    maxconn 256
    log stdout format raw local0 info

defaults
    mode tcp
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms
    log global

frontend mtproto_frontend
    bind *:443
    default_backend mtproto_backend

backend mtproto_backend
    balance roundrobin
    option tcp-check
    # Your 3 working Railway proxies
    server proxy1 zephyr.proxy.rlwy.net:50268 check
    server proxy2 zephyr.proxy.rlwy.net:53272 check
    server proxy3 crossover.proxy.rlwy.net:12089 check
